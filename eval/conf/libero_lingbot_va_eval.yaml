# LingBot-VA C++ server on LIBERO-long.
# Defaults mirror robbyant/lingbot-va's LIBERO rollout:
# camera size 128, 50 episodes per task, 800-step cap, two camera views,
# 512-token text encoder input, untruncated cache updates, and quantile
# action postprocessing in the C++ server. For Python parity, keep
# VLA_LINGBOT_PREDICT_MIXED unset or set VLA_LINGBOT_PREDICT_OFFICIAL_ORDER=1.
# Mixed mode now also requires VLA_LINGBOT_ALLOW_MIXED_PREDICT=1.
# Official-order enables runtime KV self-attn by default to preserve the Python
# cache semantics. The verified official fast path also defaults to persistent
# VAE, the validated VAE time-downsample streaming cache, graph-cache/full-forward
# runner, device-x/self-ctx D2D, device denoise bridge, and output device-out;
# disable these only for single-variable regressions. VLA_LINGBOT_RUNTIME_KV_DEVICE
# has passed the LIBERO10 task0 single-variable gate but remains explicit opt-in
# until broader task/history coverage is verified. VLA_LINGBOT_RUNTIME_KV_WARP_ATTN
# has passed a LIBERO10 task0 single-variable gate after the self-ctx post-copy
# ordering fix, but remains explicit opt-in until broader task/history coverage
# and a stream/event replacement for the current sync barrier are verified.
# VLA_LINGBOT_RUNTIME_KV_GGML_FLASH remains explicit opt-in until it passes
# checksum/parity and rollout gates.
# Runtime KV capacity follows the Python create_empty_cache() formula with
# attn_window=30 for LIBERO. The default unconditional text branch uses the
# Python empty negative prompt active token [1] (T5 EOS).

