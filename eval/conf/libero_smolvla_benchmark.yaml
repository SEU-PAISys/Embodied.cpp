# Official SmolVLA LIBERO protocol. The acceptance runner overrides the suite
# and iterates spatial, object, goal and libero_10.
arch: smolvla
task_ids: all
n_episodes: 10
max_steps: 0
seed: 1000
noise_seed: 1000

tokenizer: /root/checkpoints/smolvla_tokenizer
vla_addr: tcp://127.0.0.1:5566
output_dir: outputs/smolvla_acceptance/cpp
view_mode: multi-view
fps: 30
image_size: 512
max_state_dim: 32
real_action_dim: 7
image_keys:
  - observation.images.image
  - observation.images.image2
max_length: 48
n_action_steps: 1
recv_timeout_ms: 900000
